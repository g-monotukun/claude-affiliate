name: Threads 自動投稿

on:
  schedule:
    # 10分ごとに起動し、朝7〜9時・昼12〜14時・夜20〜23時（日本時間）の各枠で1件ずつ投稿する。
    # GitHub は混雑時に定期実行を間引く（毎時の設定でも4〜5時間おきになることがあった）ため、
    # 起動の機会を増やして各枠で確実に1回は動くようにしている。枠外・投稿済みの回は数秒で終わる
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "時間帯に関係なくすぐ1件投稿する（外部の定時起動からは false で呼ぶ）"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency: threads-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 投稿
        id: post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: python3 tools/threads_post.py
      - name: 投稿済みの記録を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads/queue.json
          git diff --cached --quiet || (git commit -m "Record Threads post" && git push)
      - name: 投稿の在庫が少なくなったら Issue でお知らせ
        if: steps.post.outputs.low_stock == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REMAINING: ${{ steps.post.outputs.remaining }}
          LOW_KIND: ${{ steps.post.outputs.low_kind }}
        run: |
          title="Threads：${LOW_KIND}の投稿が残り${REMAINING}件です"
          if gh issue list --state open --search "in:title Threads ${LOW_KIND}の投稿" --json number --jq 'length' | grep -qv '^0$'; then
            echo "お知らせの Issue はすでにあります"
          else
            gh issue create --title "$title" --body "${LOW_KIND}の未投稿が少なくなりました（残り ${REMAINING} 件）。

          threads/queue.json に投稿を追加してください（Claude に「${LOW_KIND}の投稿を追加して」と頼めます）。
          補充できたら、この Issue を閉じてください。"
          fi
