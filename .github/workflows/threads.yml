name: Threads 自動投稿

on:
  schedule:
    - cron: "17 8 * * *" # 毎日 17:17（日本時間）。GitHub の定期実行は混雑で数時間遅れることが多く、実際の投稿は 21〜22 時ごろになる
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: threads-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 投稿
        id: post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python3 tools/threads_post.py
      - name: 投稿済みの記録を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads/queue.json
          git diff --cached --quiet || (git commit -m "Record Threads post" && git push)
      - name: 案件つきの投稿が少なくなったら Issue でお知らせ
        if: steps.post.outputs.low_stock == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REMAINING: ${{ steps.post.outputs.remaining }}
        run: |
          if gh issue list --state open --search "in:title Threads 案件つきの投稿" --json number --jq 'length' | grep -qv '^0$'; then
            echo "お知らせの Issue はすでにあります"
          else
            gh issue create --title "Threads：案件つきの投稿が残り${REMAINING}件です" --body "案件（広告リンク）つきの未投稿が少なくなりました（残り ${REMAINING} 件）。

          次のどれかで補充してください。
          - 承認された案件を記事に組み込む
          - 今ある記事を別の切り口で紹介する投稿を追加する
          - 新しいサイトを検討する

          補充できたら、この Issue を閉じてください。"
          fi
