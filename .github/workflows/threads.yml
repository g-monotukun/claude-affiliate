name: Threads 自動投稿

on:
  schedule:
    - cron: "17 12 * * *" # 毎日 21:17（日本時間）
  workflow_dispatch:

permissions:
  contents: write

concurrency: threads-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 投稿
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python3 tools/threads_post.py
      - name: 投稿済みの記録を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads/queue.json
          git diff --cached --quiet || (git commit -m "Record Threads post" && git push)
